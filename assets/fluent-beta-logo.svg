<svg width="250" height="60" viewBox="0 0 250 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #111827; }
    .f-text { fill: #ffffff; }
    .fluent-text { fill: url(#textGradLight); }
    .beta-text { fill: url(#betaGrad); }
    
    @media (prefers-color-scheme: dark) {
      .box { fill: #f3f4f6; }
      .f-text { fill: #111827; }
      .fluent-text { fill: url(#textGradDark); }
    }
  </style>
  <defs>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#374151" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
    <linearGradient id="betaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- F Box (w-8 h-8 rounded-lg bg-gray-900 / dark:bg-gray-100) -->
  <rect class="box" x="10" y="14" width="32" height="32" rx="8" />
  
  <!-- F Text (text-xl font-bold text-white / dark:text-gray-900) -->
  <text class="f-text" x="26" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">F</text>
  
  <!-- Fluent Text -->
  <text class="fluent-text" x="54" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="24" letter-spacing="-0.5">Fluent</text>

  <!-- Beta Badge -->
  <rect x="130" y="21" width="36" height="16" rx="4" fill="#10B981" fill-opacity="0.15" />
  <text class="beta-text" x="148" y="32.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5" text-anchor="middle">BETA</text>
</svg>
